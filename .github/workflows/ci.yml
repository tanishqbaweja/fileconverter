name: CI

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Verification scope or exact non-Docker engine comparison
        required: true
        default: all
        type: choice
        options:
          - all
          - verify-only
          - portable-verify
          - browser-recovery
          - svg-source-lock
          - svg-source-compile
          - svg-source-compile-pathfinder
          - svg-source-compile-bytes
          - svg-source-postprocess
          - audio-destination-scopes
          - reproduce-only
          - ffmpeg-remux
          - bzip2
          - xz
          - xz-decoder
          - archive7z
          - tiff
          - jxl
          - jxl-inspector
          - jxl-encoder
          - avif
          - avif-encoder
          - svg
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  engine-matrix:
    if: github.event_name != 'workflow_dispatch' || (inputs.engine != 'verify-only' && inputs.engine != 'audio-destination-scopes' && inputs.engine != 'portable-verify' && inputs.engine != 'browser-recovery' && inputs.engine != 'svg-source-lock' && inputs.engine != 'svg-source-compile' && inputs.engine != 'svg-source-compile-pathfinder' && inputs.engine != 'svg-source-compile-bytes' && inputs.engine != 'svg-source-postprocess')
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.manifest.outputs.engines }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit published engine coverage
        run: npm run audit:engine-reproducibility

      - id: manifest
        name: Export non-Docker engine build matrix
        shell: bash
        env:
          SELECTED_ENGINE: ${{ inputs.engine || 'all' }}
        run: |
          args=(--non-docker)
          if test "$SELECTED_ENGINE" != all && \
              test "$SELECTED_ENGINE" != reproduce-only; then
            args+=(--engine "$SELECTED_ENGINE")
          fi
          echo "engines=$(node scripts/engine-reproducibility-manifest.mjs "${args[@]}")" >> "$GITHUB_OUTPUT"

  reproduce-engines:
    needs: engine-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.engine-matrix.outputs.engines) }}
    name: Reproduce non-Docker ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies for the engine builder
        if: matrix.installNodeModules
        run: npm ci

      - name: Install native FFmpeg build prerequisites
        if: matrix.emscriptenVersion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake ca-certificates curl libtool make patch \
            pkg-config xz-utils

      - name: Install pinned Emscripten SDK without Docker
        if: matrix.emscriptenVersion
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/emscripten-core/emsdk.git work/emsdk
          git -C work/emsdk checkout "${{ matrix.emsdkCommit }}"
          test "$(git -C work/emsdk rev-parse HEAD)" = \
            "${{ matrix.emsdkCommit }}"
          work/emsdk/emsdk install "${{ matrix.emscriptenVersion }}"
          work/emsdk/emsdk activate "${{ matrix.emscriptenVersion }}"

      - name: Rebuild pinned engine
        shell: bash
        run: ${{ matrix.command }}
        env:
          WITHIN_KEEP_NONDOCKER_OUTPUT: "1"

      - name: Normalize generated artifact permissions
        shell: bash
        run: find "${{ matrix.output }}" -type f -exec chmod 0644 {} +

      - name: Verify reproducible engine artifacts
        run: git diff --exit-code -- ${{ matrix.output }}

      - name: Upload bounded engine mismatch evidence
        if: failure() && matrix.emscriptenVersion
        uses: actions/upload-artifact@v4
        with:
          name: engine-mismatch-${{ matrix.id }}
          path: work/*-nondocker-output/
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove repository-local engine build data
        if: always() && matrix.emscriptenVersion
        shell: bash
        run: |
          if test -d /emsdk && ! test -L /emsdk && \
              test -f /emsdk/.within-fileconverter-owner; then
            sdk_owner="$(sudo cat /emsdk/.within-fileconverter-owner)"
            if test "$sdk_owner" = "$GITHUB_WORKSPACE/work/emsdk" && \
                ! test -e "$sdk_owner"; then
              sudo mv /emsdk "$sdk_owner"
              rm -- "$sdk_owner/.within-fileconverter-owner"
            fi
          fi
          for link_path in /src /out; do
            if test -L "$link_path"; then
              link_target="$(readlink -f "$link_path")"
              case "$link_target" in
                "$GITHUB_WORKSPACE/work/"*-nondocker-build|\
                "$GITHUB_WORKSPACE/work/"*-nondocker-output)
                  sudo unlink "$link_path"
                  ;;
              esac
            fi
          done
          rm -rf -- \
            "$GITHUB_WORKSPACE/work/emsdk" \
            "$GITHUB_WORKSPACE/work/"*-nondocker-build \
            "$GITHUB_WORKSPACE/work/"*-nondocker-output

  svg-source-lock:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'svg-source-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve private SVG candidate dependencies without compiling or publishing
        run: bash images/resvg-source/resolve-lock.sh
      - name: Retain bounded candidate dependency provenance only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: svg-source-lock-${{ github.run_id }}
          path: outputs/reports/resvg-source-lock-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 1

  svg-source-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'svg-source-compile'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile retained SVG lock with recorded nightly without publishing
        run: node images/resvg-source/compile-candidate.mjs
      - name: Verify public engines were not replaced
        if: always()
        run: git diff --exit-code -- public/engines
      - name: Retain bounded compiler result and raw pre-bindgen candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-source-compile-${{ github.run_id }}
          path: |
            outputs/reports/resvg-source-compile-${{ github.run_id }}.json
            outputs/reports/resvg-source-compile-${{ github.run_id }}.wasm
          if-no-files-found: warn
          retention-days: 1

  svg-source-compile-pathfinder:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'svg-source-compile-pathfinder'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile one exact source-declared Pathfinder dependency repair
        run: node images/resvg-source/compile-candidate.mjs --pathfinder-0.5.2
      - name: Verify public engines were not replaced
        if: always()
        run: git diff --exit-code -- public/engines
      - name: Retain bounded compiler diagnosis, lock and raw candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-source-pathfinder-${{ github.run_id }}
          path: |
            outputs/reports/resvg-source-compile-${{ github.run_id }}.json
            outputs/reports/resvg-source-compile-${{ github.run_id }}.lock
            outputs/reports/resvg-source-compile-${{ github.run_id }}.wasm
          if-no-files-found: warn
          retention-days: 1

  svg-source-compile-bytes:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'svg-source-compile-bytes'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compile published-witness Bytes pin with measured Pathfinder fix
        run: node images/resvg-source/compile-candidate.mjs --bytes-1.6.0
      - name: Verify public engines were not replaced
        if: always()
        run: git diff --exit-code -- public/engines
      - name: Retain bounded compiler report, exact lock and raw candidate only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-source-bytes-${{ github.run_id }}
          path: |
            outputs/reports/resvg-source-compile-${{ github.run_id }}.json
            outputs/reports/resvg-source-compile-${{ github.run_id }}.lock
            outputs/reports/resvg-source-compile-${{ github.run_id }}.wasm
          if-no-files-found: warn
          retention-days: 1

  svg-source-postprocess:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'svg-source-postprocess'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Process exact retained raw source artifact without recompilation
        run: node images/resvg-source/postprocess-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "true"
      - name: Verify public engines were not replaced
        if: always()
        run: git diff --exit-code -- public/engines
      - name: Retain only private bounded candidate, glue and build receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-source-postprocess-${{ github.run_id }}
          path: |
            outputs/reports/resvg-postprocess-${{ github.run_id }}.json
            outputs/reports/resvg-postprocess-${{ github.run_id }}.wasm
            outputs/reports/resvg-postprocess-${{ github.run_id }}.mjs
          if-no-files-found: warn
          retention-days: 1

  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'verify-only' || inputs.engine == 'portable-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare repository-owned CI runtime
        run: node scripts/ci-owned-runtime.mjs prepare

      - uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Audit public route evidence
        run: npm run audit:public-evidence:manifest

      - name: Audit complete unit inventory (private qualification not executed here)
        run: npm run test:unit:inventory

      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm test

      - name: Run network privacy and offline browser tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: output/playwright/verify-results.json
        run: npx playwright test tests/browser/privacy-offline.spec.ts tests/browser/static-host-policy.spec.ts tests/browser/svg-publication-gate.spec.ts --reporter=line,json,html

      - name: Retain compact verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: output/playwright/verify-results.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload verification failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-verify
          path: |
            output/playwright/artifacts
            output/playwright/report
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove owned CI runtime
        if: always()
        env:
          NODE_DISABLE_COMPILE_CACHE: "1"
        run: node scripts/ci-owned-runtime.mjs cleanup

  browser-conversions:
    if: github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'verify-only' || inputs.engine == 'browser-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        # Recovery follows a terminal incomplete run, without replaying its
        # successful suites. Normal all/verify-only retains the complete matrix.
        suite: ${{ fromJSON(inputs.engine == 'browser-recovery' && '["media-remux","streaming-conversions"]' || '["image-conversions","media-remux","audio-source-metadata","audio-destination-scopes","streaming-conversions"]') }}
    name: Browser conversions (${{ matrix.suite }})
    steps:
      - uses: actions/checkout@v4

      - name: Prepare repository-owned CI runtime
        run: node scripts/ci-owned-runtime.mjs prepare

      - uses: actions/setup-node@v4
        with:
          node-version: "24.7.0"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update
      - name: Install independent native validators
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Keep required FFmpeg/bsdtar libraries, but avoid optional speech
          # models and driver bundles that exhausted the old setup budget.
          sudo apt-get install -y --no-install-recommends ffmpeg libarchive-tools
          python -m pip install --disable-pip-version-check -r scripts/requirements-ci-validators.txt

      - name: Run browser conversions and independent validators
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: output/playwright/${{ matrix.suite }}-results.json
        run: npx playwright test tests/browser/${{ matrix.suite }}.spec.ts --reporter=line,json,html

      - name: Retain compact browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ matrix.suite }}
          path: output/playwright/${{ matrix.suite }}-results.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ matrix.suite }}
          path: |
            output/playwright/artifacts
            output/playwright/report
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove owned CI runtime
        if: always()
        env:
          NODE_DISABLE_COMPILE_CACHE: "1"
        run: node scripts/ci-owned-runtime.mjs cleanup

  audio-destination-scopes:
    if: github.event_name == 'workflow_dispatch' && inputs.engine == 'audio-destination-scopes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_cache: ${{ github.workspace }}/work/audio-scope-npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/work/audio-scope-browsers
      WRANGLER_SEND_METRICS: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      WITHIN_TEST_VIDEO: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: mkdir -p work
      - run: npm ci

      - name: Check TypeScript semantics before browser execution
        run: npx tsc --noEmit --incremental false

      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run only genuine browser destination-scope checks
        shell: bash
        run: |
          task_browser_tmp="$(mktemp -d "$GITHUB_WORKSPACE/work/t.XXXXXX")"
          trap 'rm -rf -- "$task_browser_tmp"' EXIT
          TMPDIR="$task_browser_tmp" TEMP="$task_browser_tmp" TMP="$task_browser_tmp" \
            npx playwright test tests/browser/audio-destination-scopes.spec.ts

      - name: Retain compact scope results, never generated media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-destination-scopes-${{ github.run_id }}
          path: output/playwright/audio-destination-scopes-*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Remove owned browser dependencies and caches
        if: always()
        shell: bash
        run: |
          for task_path in "$GITHUB_WORKSPACE/work/audio-scope-npm-cache" "$GITHUB_WORKSPACE/work/audio-scope-browsers"; do
            case "$task_path" in
              "$GITHUB_WORKSPACE/work/audio-scope-npm-cache"|"$GITHUB_WORKSPACE/work/audio-scope-browsers") ;;
              *) exit 2 ;;
            esac
            test ! -L "$task_path"
            rm -rf -- "$task_path"
          done

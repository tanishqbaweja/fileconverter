name: Private SVG precision source postprocess repetition

on:
  workflow_dispatch:
  push:
    branches: ["media-options"]
    paths: [".github/workflows/svg-precision-postprocess.yml"]

permissions:
  contents: read
  actions: read

jobs:
  postprocess-precision-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify four source patches and compare repeated capped postprocessors
        run: node images/resvg-source/postprocess-filter-region-source.mjs --precision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "true"
      - name: Verify public engines unchanged
        if: always()
        run: git diff --exit-code -- public/engines
      - name: Retain private precision candidate and exact evidence for one day
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svg-filter-precision-processed-${{ github.run_id }}
          path: |
            outputs/reports/resvg-filter-precision-processed-owner-${{ github.run_id }}.json
            outputs/reports/resvg-source-processed-repeat-${{ github.run_id }}.json
            outputs/reports/resvg-source-processed-repeat-${{ github.run_id }}.wasm
            outputs/reports/resvg-source-processed-repeat-${{ github.run_id }}.mjs
          if-no-files-found: warn
          retention-days: 1
